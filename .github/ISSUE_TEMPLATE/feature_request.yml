name: ✨ 기능 요청
description: 새로운 기능이나 개선 사항을 제안합니다.
title: '[Feat] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 배경 / 문제
      description: 어떤 불편이나 요구가 있어서 이 기능이 필요한지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 어떻게 동작했으면 하는지 구체적으로 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 디자인 / 참고 자료
      description: Figma 링크, 레퍼런스 앱 캡처 등이 있으면 첨부해 주세요.

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법을 검토했다면 왜 채택하지 않았는지 적어 주세요.

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 구현에 필요한 세부 작업을 체크리스트로 적어 주세요.
      value: |
        - [ ]
        - [ ]

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - 높음
        - 보통
        - 낮음
    validations:
      required: true
